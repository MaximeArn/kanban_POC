<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">Page introuvable</title>
  <desc id="d">La mascotte de l'Usine de Pilotage, perplexe, entre les chiffres 4 et 4 : cette adresse ne mène à aucune vue.</desc>
  <rect x="1" y="1" width="718" height="438" rx="24" fill="#fff" stroke="#e6e3da" stroke-width="2"/>
  <g font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" fill="#143777" text-anchor="middle">
    <text x="165" y="245" font-size="210">4</text>
    <text x="555" y="245" font-size="210">4</text>
  </g>
  <!-- Recadrée : le haut du fichier d'origine contient un reste de la planche de mascottes. -->
  <svg x="236" y="50" width="248" height="208" viewBox="0 24 308 256">
    <image width="308" height="280" href="data:image/jpeg;base64,"/>
  </svg>
  <text x="360" y="328" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="30" fill="#143777" text-anchor="middle">Page introuvable</text>
  <text x="360" y="370" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" font-size="18" fill="#5a6172" text-anchor="middle">Cette adresse ne mène à aucune vue de l’Usine de Pilotage.</text>
</svg>
